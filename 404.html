<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisuaLed | Página no encontrada</title>
  <meta name="robots" content="noindex, follow">

  <!-- Interceptor Inteligente de Redirecciones (Reseñas Google & Variaciones) -->
  <script>
    (function () {
      try {
        var path = decodeURIComponent(window.location.pathname.toLowerCase());
        if (
          path.includes('rese') || 
          path.includes('review') || 
          path.includes('calificar') || 
          path.includes('opinion')
        ) {
          window.location.replace('https://g.page/r/CTlX2Tjs_tNlEBM/review');
        }
      } catch (e) {
        var rawPath = window.location.pathname.toLowerCase();
        if (rawPath.indexOf('rese') !== -1 || rawPath.indexOf('review') !== -1) {
          window.location.replace('https://g.page/r/CTlX2Tjs_tNlEBM/review');
        }
      }
    })();
  </script>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Tipografía Montserrat Oficial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul-corp: #003878;
      --celeste-led: #00AEEF;
      --blanco: #FFFFFF;
      --gris-suave: #F2F5F8;
      --grafito: #101820;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #172433 0%, #101820 100%);
      color: var(--blanco);
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .error-card {
      background: rgba(16, 24, 32, 0.9);
      border: 1px solid rgba(0, 174, 239, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45), 0 0 25px rgba(0, 174, 239, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .error-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--azul-corp), var(--celeste-led));
    }

    .logo-container {
      max-width: 170px;
      margin-bottom: 0.25rem;
    }

    .logo-container img {
      max-width: 100%;
      height: auto;
    }

    .error-code {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--celeste-led), #FFFFFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 0.25rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--blanco);
    }

    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #CBD5E1;
    }

    .btn-home {
      margin-top: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--azul-corp), #0056b3);
      color: var(--blanco);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 0.85rem 1.6rem;
      border-radius: 12px;
      border: 1px solid rgba(0, 174, 239, 0.5);
      box-shadow: 0 4px 15px rgba(0, 56, 120, 0.4);
      transition: all 0.25s ease;
      width: 100%;
    }

    .btn-home:hover {
      background: linear-gradient(135deg, #004c9e, var(--celeste-led));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 174, 239, 0.4);
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="logo-container">
      <img src="/imagenes/visualed_logo.png" alt="VisuaLed Logo" onerror="this.onerror=null; this.src='imagenes/visualed_logo.png';">
    </div>

    <div class="error-code">404</div>

    <h1>Página no encontrada</h1>
    
    <p>La dirección que buscas no existe o ha sido movida. Puedes volver al inicio para conocer nuestros servicios publicitarios.</p>

    <a href="/" class="btn-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Volver al Inicio
    </a>
  </div>
</body>
</html>
